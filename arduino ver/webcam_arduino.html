<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daksham Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Google Sans', 'Google Sans Flex', system-ui, sans-serif; margin: 2rem auto; max-width: 640px; padding: 0 1rem; text-align: center; }
    button, input, code { font-family: inherit; }
    code { font-family: ui-monospace, Consolas, monospace; }
    #webcam-container { display: flex; justify-content: center; }
    #webcam-container canvas {
        border-radius: 28px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        max-width: 100%;
        height: auto;
    }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
    .row { display: flex; align-items: center; justify-content: center; gap: 1rem; }
    .file-btn {
        display: inline-block;
        margin: 0.4rem 0;
        padding: 0.5rem 1.2rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: #6b7280;
        color: #fff;
        transition: background 0.2s;
    }
    .file-btn:hover { background: #4b5563; }
    #file-status div { margin: 2px 0; }
    .ok { color: #1b7f3b; }
    .missing { color: #b00020; }
    /* Camera slides down inside the Start/Stop box (and back up on Stop) */
    #webcam-container {
        box-sizing: border-box;
        overflow: hidden;
        max-height: 0;
        margin: 0 -24px;
        padding: 0 24px;
        opacity: 0;
        transition: max-height 0.6s ease, padding-bottom 0.6s ease,
                    margin-top 0.6s ease, opacity 0.6s ease;
    }
    #webcam-container.show {
        max-height: 420px;
        margin-top: 1rem;
        padding-bottom: 28px; /* room so the shadow isn't clipped */
        opacity: 1;
    }
    #webcam-container canvas {
        transform: translateY(-60px);
        transition: transform 0.6s ease;
    }
    #webcam-container.show canvas { transform: translateY(0); }
    #label-container div { margin: 2px 0; }
    #label-container { margin-top: 0.75rem; }
    #label-container:empty, #result:empty { margin: 0; }
    #error { color: #b00020; margin-top: 1rem; }
    #result { font-size: 1.4rem; font-weight: 600; margin-top: 1rem; }
    #eval-btn { display: none; margin-top: 0.5rem; }

    /* Rounded buttons: Evaluate and the popup's OK */
    #eval-btn, #modal button {
        border: none;
        border-radius: 999px;
        padding: 0.7rem 1.8rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: #6b7280;
        color: #fff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s, background 0.2s;
    }
    #eval-btn:hover, #modal button:hover { background: #4b5563; }
    #eval-btn:active, #modal button:active { transform: scale(0.96); }

    /* Rounded Start and Choose Files buttons */
    #start-btn {
        border: none;
        border-radius: 999px;
        padding: 0.7rem 1.8rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: #6b7280;
        color: #fff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s, background 0.2s;
    }
    #start-btn:hover:not(:disabled) { background: #4b5563; }
    #start-btn:active:not(:disabled) { transform: scale(0.96); }
    #start-btn:disabled { box-shadow: none; }

    input[type="file"]::file-selector-button {
        font-family: inherit;
        border: none;
        border-radius: 999px;
        padding: 0.5rem 1.2rem;
        margin-right: 0.6rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: #6b7280;
        color: #fff;
        transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover { background: #4b5563; }

    /* Result popup */
    #modal-backdrop {
        display: none; position: fixed; inset: 0; z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        align-items: center; justify-content: center;
    }
    #modal-backdrop.open { display: flex; }
    #modal {
        background: #fff; color: #111; border-radius: 12px;
        padding: 2rem 2.5rem; text-align: center; min-width: 260px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    #modal-label { color: #666; font-size: 0.95rem; }
    #modal-name { font-size: 2rem; font-weight: 700; margin: 0.5rem 0; }
    #modal-percent { font-size: 1.2rem; color: #1b7f3b; margin-bottom: 1.25rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Arduino buttons */
    .pill {
        border: none;
        border-radius: 999px;
        padding: 0.7rem 1.8rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: #6b7280;
        color: #fff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s, background 0.2s;
    }
    .pill.small { padding: 0.5rem 1.2rem; font-size: 0.95rem; }
    .pill:hover:not(:disabled) { background: #4b5563; }
    .pill:active:not(:disabled) { transform: scale(0.96); }
    #arduino-status { min-height: 1.2em; }
    #arduino-status.ok { color: #1b7f3b; }
    #arduino-status.err { color: #b00020; }
</style>
</head>
<body>
<h2>Smart Waste Segregator</h2>

<div class="box">
    <label for="model-files"><strong>Upload your model files</strong></label><br>
    <label for="model-files" class="file-btn">Choose Files</label>
    <input type="file" id="model-files" multiple accept=".json,.bin" hidden>
    <div class="hint">Select all three files at once: <code>model.json</code>, <code>metadata.json</code> and <code>weights.bin</code> (keep the original names).</div>
    <div id="file-status">
        <div id="st-model" class="missing">✗ model.json</div>
        <div id="st-meta" class="missing">✗ metadata.json</div>
        <div id="st-weights" class="missing">✗ weights.bin</div>
    </div>
</div>

<div class="box">
    <div class="row">
        <button type="button" id="start-btn" onclick="toggleCamera()" disabled>Start</button>
    </div>
    <div id="webcam-container"></div>
    <div id="label-container"></div>
    <div id="result"></div>
    <button type="button" id="eval-btn" onclick="startEvaluation()">Evaluate</button>
</div>

<div class="box">
    <strong>Arduino (two lifts)</strong>
    <div class="row" style="margin-top: 0.6rem;">
        <button type="button" id="arduino-btn" class="pill" onclick="toggleArduino()">Connect Arduino</button>
    </div>
    <div class="row" style="margin-top: 0.6rem;">
        <button type="button" id="test1-btn" class="pill small" onclick="sendToArduino(0, true)" disabled>Test lift 1</button>
        <button type="button" id="test2-btn" class="pill small" onclick="sendToArduino(1, true)" disabled>Test lift 2</button>
    </div>
    <div class="hint" id="arduino-status">Not connected. Click Connect and choose your Arduino's port.</div>
</div>

<div id="error"></div>

<!-- Result popup -->
<div id="modal-backdrop" onclick="if (event.target === this) closeResultModal()">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <div id="modal-label">Result</div>
        <div id="modal-name"></div>
        <div id="modal-percent"></div>
        <button type="button" onclick="closeResultModal()">OK</button>
    </div>
</div>

<!-- Pinned versions used in Teachable Machine's own docs (more stable than @latest) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    let model, webcam, labelContainer, maxPredictions;
    let started = false;
    let running = false;
    let animId = null;
    let fadeTimer = null;
    let modelFile = null, metadataFile = null, weightsFile = null;

    const fileInput = document.getElementById("model-files");
    const startBtn = document.getElementById("start-btn");

    function setStatus(id, file, label) {
        const el = document.getElementById(id);
        el.className = file ? "ok" : "missing";
        el.textContent = (file ? "✓ " : "✗ ") + (file ? file.name : label);
    }

    // Sort the selected files into model / metadata / weights by name
    fileInput.addEventListener("change", () => {
        modelFile = metadataFile = weightsFile = null;
        for (const f of fileInput.files) {
            const name = f.name.toLowerCase();
            if (name.endsWith(".bin")) weightsFile = f;
            else if (name.endsWith(".json") && name.includes("metadata")) metadataFile = f;
            else if (name.endsWith(".json")) modelFile = f;
        }
        setStatus("st-model", modelFile, "model.json");
        setStatus("st-meta", metadataFile, "metadata.json");
        setStatus("st-weights", weightsFile, "weights.bin");
        startBtn.disabled = running ? false : (!(modelFile && metadataFile && weightsFile) || started);
    });

    // Load the uploaded model and set up the webcam
    async function init() {
        if (started) return; // prevent double-starts
        started = true;
        startBtn.disabled = true;
        document.getElementById("error").textContent = "";

        try {
            if (!(modelFile && metadataFile && weightsFile)) {
                throw new Error("Please select model.json, metadata.json and weights.bin first.");
            }

            // Load from the uploaded files (order: model, weights, metadata)
            // Make sure the weights file name matches what model.json expects
            const manifest = JSON.parse(await modelFile.text());
            const expected = manifest.weightsManifest && manifest.weightsManifest[0] &&
                manifest.weightsManifest[0].paths && manifest.weightsManifest[0].paths[0];
            if (expected && expected.split("/").pop() !== weightsFile.name) {
                throw new Error('model.json expects a weights file named "' + expected +
                    '" but you selected "' + weightsFile.name + '". Rename the file and select it again.');
            }

            model = await tmImage.loadFromFiles(modelFile, weightsFile, metadataFile);
            maxPredictions = model.getTotalClasses();

            const flip = true; // whether to flip the webcam
            webcam = new tmImage.Webcam(320, 320, flip); // width, height, flip
            await webcam.setup(); // request access to the webcam
            await webcam.play();

            // Add the camera and fade it in
            const camBox = document.getElementById("webcam-container");
            clearTimeout(fadeTimer);
            camBox.innerHTML = "";
            camBox.appendChild(webcam.canvas);
            window.requestAnimationFrame(() =>
                window.requestAnimationFrame(() => camBox.classList.add("show")));
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            // Show the live camera first; evaluation starts only when the button is clicked
            document.getElementById("result").textContent = "Ready. Click Evaluate to begin.";
            document.getElementById("eval-btn").style.display = "inline-block";
            running = true;
            startBtn.textContent = "Stop";
            startBtn.disabled = false;
            animId = window.requestAnimationFrame(loop);
        } catch (e) {
            started = false;
            startBtn.disabled = !(modelFile && metadataFile && weightsFile);
            document.getElementById("error").textContent =
                "Error: " + ((e && (e.message || e.name)) || String(e));
            console.error(e);
        }
    }

    // The Start button toggles between Start and Stop
    function toggleCamera() {
        if (running) stopCamera();
        else init();
    }

    // Stop the camera and reset the page so it can be started again
    function stopCamera() {
        running = false;
        started = false;
        evaluating = false;
        if (animId) window.cancelAnimationFrame(animId);
        animId = null;
        if (webcam) {
            webcam.stop(); // release the camera
            webcam = null;
        }
        // Fade the camera out, then remove it
        const camBox = document.getElementById("webcam-container");
        camBox.classList.remove("show");
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(() => { camBox.innerHTML = ""; }, 600);
        document.getElementById("label-container").innerHTML = "";
        document.getElementById("result").textContent = "";
        const evalBtn = document.getElementById("eval-btn");
        evalBtn.style.display = "none";
        evalBtn.textContent = "Evaluate";
        closeResultModal();
        startBtn.textContent = "Start";
        startBtn.disabled = !(modelFile && metadataFile && weightsFile);
    }

    // How often to run the model, in milliseconds (500 = every 0.5 seconds)
    const UPDATE_INTERVAL_MS = 500;
    let lastPredictionTime = 0;

    async function loop(timestamp) {
        if (!running || !webcam) return;
        webcam.update(); // keep the video smooth
        if (timestamp - lastPredictionTime >= UPDATE_INTERVAL_MS) {
            lastPredictionTime = timestamp;
            await predict(); // refresh the labels every 0.5 seconds
        }
        if (!running) return; // stopped while predicting
        animId = window.requestAnimationFrame(loop);
    }

    // Run the webcam image through the image model
    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        if (!running) return; // stopped while predicting
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }

        // Collect predictions during the evaluation window
        if (evaluating) {
            evalCount++;
            for (let i = 0; i < maxPredictions; i++) {
                evalSums[i] += prediction[i].probability;
                evalNames[i] = prediction[i].className;
            }

            const elapsed = performance.now() - evalStart;
            const resultEl = document.getElementById("result");

            if (elapsed < EVAL_DURATION_MS) {
                const secondsLeft = Math.ceil((EVAL_DURATION_MS - elapsed) / 1000);
                resultEl.textContent = "Evaluating... " + secondsLeft + "s";
            } else {
                // Pick the class with the highest average probability
                let best = 0;
                for (let i = 1; i < maxPredictions; i++) {
                    if (evalSums[i] > evalSums[best]) best = i;
                }
                const avgPercent = ((evalSums[best] / evalCount) * 100).toFixed(0);
                resultEl.textContent = "";
                evaluating = false;
                showResultModal(evalNames[best], avgPercent);
                sendToArduino(best); // lift the matching lid on the Arduino
                const evalBtn = document.getElementById("eval-btn");
                evalBtn.textContent = "Evaluate again";
                evalBtn.style.display = "inline-block";
            }
        }
    }

    // Evaluate for 5 seconds, then show what it is (highest average match)
    const EVAL_DURATION_MS = 5000;
    let evalStart = 0, evalSums = [], evalNames = [], evalCount = 0, evaluating = false;

    // Popup window showing the final result
    function showResultModal(name, percent) {
        document.getElementById("modal-name").textContent = name;
        document.getElementById("modal-percent").textContent = percent + "% match";
        document.getElementById("modal-backdrop").classList.add("open");
    }

    function closeResultModal() {
        document.getElementById("modal-backdrop").classList.remove("open");
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeResultModal();
    });

    // ---------- Arduino (Web Serial) ----------
    // Class 1 in the model -> lift 1 ("L1"), class 2 -> lift 2 ("L2")
    let port = null, writer = null;
    const arduinoBtn = document.getElementById("arduino-btn");
    const arduinoStatus = document.getElementById("arduino-status");

    function setArduinoStatus(text, kind) {
        arduinoStatus.textContent = text;
        arduinoStatus.className = "hint" + (kind ? " " + kind : "");
    }

    function setArduinoUI(connected) {
        arduinoBtn.textContent = connected ? "Disconnect Arduino" : "Connect Arduino";
        document.getElementById("test1-btn").disabled = !connected;
        document.getElementById("test2-btn").disabled = !connected;
    }

    async function toggleArduino() {
        if (port) { await disconnectArduino(); return; }
        if (!("serial" in navigator)) {
            setArduinoStatus("This browser has no Web Serial support. Use Chrome or Edge on a computer.", "err");
            return;
        }
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            writer = port.writable.getWriter();
            setArduinoUI(true);
            setArduinoStatus("Arduino connected. Wait about 2 seconds for it to restart.", "ok");
        } catch (e) {
            port = null; writer = null;
            setArduinoUI(false);
            setArduinoStatus("Could not connect: " + ((e && (e.message || e.name)) || String(e)), "err");
        }
    }

    async function disconnectArduino() {
        try {
            if (writer) writer.releaseLock();
            if (port) await port.close();
        } catch (e) { console.error(e); }
        port = null; writer = null;
        setArduinoUI(false);
        setArduinoStatus("Disconnected.", "");
    }

    // classIndex 0 -> lift 1, classIndex 1 -> lift 2
    async function sendToArduino(classIndex, isTest) {
        if (!writer) {
            if (!isTest) setArduinoStatus("Result not sent: Arduino is not connected.", "err");
            return;
        }
        if (classIndex > 1) {
            setArduinoStatus("Class " + (classIndex + 1) + " has no lift (only two are supported).", "err");
            return;
        }
        const cmd = "L" + (classIndex + 1) + "\n";
        try {
            await writer.write(new TextEncoder().encode(cmd));
            setArduinoStatus("Sent: lifting lift " + (classIndex + 1) + ".", "ok");
        } catch (e) {
            setArduinoStatus("Send failed: " + ((e && (e.message || e.name)) || String(e)), "err");
        }
    }

    // Reset the buttons if the cable is unplugged
    if ("serial" in navigator) {
        navigator.serial.addEventListener("disconnect", () => {
            port = null; writer = null;
            setArduinoUI(false);
            setArduinoStatus("Arduino was unplugged.", "err");
        });
    }

    function startEvaluation() {
        if (!model || evaluating) return;
        evalStart = performance.now();
        evalSums = new Array(maxPredictions).fill(0);
        evalNames = new Array(maxPredictions).fill("");
        evalCount = 0;
        evaluating = true;
        document.getElementById("result").textContent = "Evaluating... 5s";
        document.getElementById("eval-btn").style.display = "none";
    }
</script>
</body>
</html>
